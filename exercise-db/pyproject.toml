[project]
name = "spottr-exercise-db"
version = "0.1.0"
description = "Spottr exercise reference database: exercises and the muscles they train, merged from openly licensed sources."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spottr_exdb"]
