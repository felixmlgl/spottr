  # calves
  - {id: gastrocnemius, parent: calves, name_en: Gastrocnemius, name_de: Zwillingswadenmuskel, latin_name: Musculus gastrocnemius, body_view: back}
  - {id: soleus, parent: calves, name_en: Soleus, name_de: Schollenmuskel, latin_name: Musculus soleus, body_view: back}
  - {id: tibialis_anterior, parent: calves, name_en: Tibialis anterior, name_de: Vorderer Schienbeinmuskel, latin_name: Musculus tibialis anterior, body_view: front}
  # neck
  - {id: sternocleidomastoid, parent: neck, name_en: Sternocleidomastoid, name_de: Kopfwender, latin_name: Musculus sternocleidomastoideus, body_view: front}
