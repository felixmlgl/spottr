  # traps
  - {id: upper_trapezius, parent: traps, name_en: Upper trapezius, name_de: Oberer Trapezmuskel, latin_name: "Musculus trapezius, pars descendens", body_view: both}
  - {id: levator_scapulae, parent: traps, name_en: Levator scapulae, name_de: Schulterblattheber, latin_name: Musculus levator scapulae, body_view: back}
  # lower back
  - {id: erector_spinae, parent: lower_back, name_en: Erector spinae, name_de: Rückenstrecker, latin_name: Musculus erector spinae, body_view: back}
  - {id: quadratus_lumborum, parent: lower_back, name_en: Quadratus lumborum, name_de: Quadratischer Lendenmuskel, latin_name: Musculus quadratus lumborum, body_view: null}
  # glutes
  - {id: gluteus_maximus, parent: glutes, name_en: Gluteus maximus, name_de: Großer Gesäßmuskel, latin_name: Musculus gluteus maximus, body_view: back}
  - {id: gluteus_medius, parent: glutes, name_en: Gluteus medius, name_de: Mittlerer Gesäßmuskel, latin_name: Musculus gluteus medius, body_view: back}
  - {id: gluteus_minimus, parent: glutes, name_en: Gluteus minimus, name_de: Kleiner Gesäßmuskel, latin_name: Musculus gluteus minimus, body_view: null}
  # hip flexors
  - {id: iliopsoas, parent: hip_flexors, name_en: Iliopsoas, name_de: Lenden-Darmbein-Muskel, latin_name: Musculus iliopsoas, body_view: front}
  - {id: sartorius, parent: hip_flexors, name_en: Sartorius, name_de: Schneidermuskel, latin_name: Musculus sartorius, body_view: front}
  # quads
  - {id: rectus_femoris, parent: quads, name_en: Rectus femoris, name_de: Gerader Schenkelmuskel, latin_name: Musculus rectus femoris, body_view: front}
