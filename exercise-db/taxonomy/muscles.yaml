  - {id: adductor_longus, parent: adductors, name_en: Adductor longus, name_de: Langer Schenkelanzieher, latin_name: Musculus adductor longus, body_view: front}
  - {id: adductor_brevis, parent: adductors, name_en: Adductor brevis, name_de: Kurzer Schenkelanzieher, latin_name: Musculus adductor brevis, body_view: null}
  - {id: gracilis, parent: adductors, name_en: Gracilis, name_de: Schlankmuskel, latin_name: Musculus gracilis, body_view: front}
  - {id: pectineus, parent: adductors, name_en: Pectineus, name_de: Kammmuskel, latin_name: Musculus pectineus, body_view: front}
