# Exercise-name normalization (hand-maintained). Used for the merge key, fuzzy matching,
# variation detection and the movement-pattern / laterality rules.
#
# Order: lowercase, accents stripped, "&" -> "and", punctuation -> space, then
#   phrases (multi-word, longest first) -> abbreviations (single token) -> plurals -> phrases again,
#   then for the match key: filler and equipment tokens dropped, tokens sorted.

