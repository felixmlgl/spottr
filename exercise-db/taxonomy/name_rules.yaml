# Dropped from the match key (carry no meaning for identity).
filler: [the, a, an, with, "on", of, and, to, in, for, at, using, exercise, movement, version,
         flat, standard, regular, normal, conventional, basic, classic, traditional,
         variation]

# Tokens that turn an exercise into a variation of another one (variation_of). Two names that
# differ only by these tokens are never merged; the one without them is the base.
modifiers: [incline, decline, closegrip, widegrip, reversegrip, neutralgrip, pronated, supinated,
            singlearm, singleleg, alternating, seated, standing, kneeling, lying, deficit,
            paused, pause, sumo, hammer, front, romanian, stiffleg, weighted, assisted, banded,
            behind, neck, rack, partial, isometric, tempo, jumping, jump, reverse, widestance,
            closestance, overhand, underhand, bentover]

# A trailing " – <equipment>" in a name (longhaul-fitness style, "Dip – Bar") is dropped for matching
# when the suffix is the record's own equipment value and consists only of equipment tokens and
# these attachment words. "Calf Raise – Leg Press Machine" keeps its suffix (it names the setup).
# Words that change the exercise (landmine, t-bar, belt, box, bench, "feet in rings") are not listed.
suffix_words: [bar, rope, rings, ring, handles, handle, high, low, hand, weights, with]

# Equipment tokens: dropped from the match key, because equipment is a separate part of the key.
equipment_tokens: [barbell, dumbbell, kettlebell, cable, machine, smithmachine, ezbar, trapbar,
                   band, medicineball, exerciseball, plate, bodyweight, foamroller, bosu]

# Slugs (permanent exercise ids) are built from the display name of the record that creates the
# exercise: lowercase ASCII, abbreviations expanded, plurals singularized, equipment words moved to
# the front (in their slug form), filler dropped; if the name has no equipment word and the record
# has exactly one load equipment, that equipment is prefixed ("Bench Press" -> barbell-bench-press).
# Synonyms are NOT applied, so the slug keeps the source's wording.
slug:
  words: {benchpress: bench press, pullups: pull up, pushups: push up, chinups: chin up, situps: sit up}
  plurals: {ups: up, downs: down, outs: out, ins: in}
  filler: [the, a, an, with, "on", of, using]
  filler_phrases: [medium grip]
  # Kept in place, never treated as equipment ("Rowing Machine" is a cardio machine, "IT band" a body part).
  keep_phrases: [rowing machine, it band, iliotibial band]
  equipment:
    smith machine: smith-machine
    smith: smith-machine
    multi press: smith-machine
    multipress: smith-machine
    foam roller: foam-roller
    foam roll: foam-roller
    bosu: bosu
    plate: plate
    e z curl bar: ez-bar
    ez curl bar: ez-bar
    e z bar: ez-bar
    ez bar: ez-bar
    ezbar: ez-bar
    sz bar: ez-bar
    trap bar: trap-bar
    hex bar: trap-bar
    medicine ball: medicine-ball
    exercise ball: exercise-ball
    swiss ball: exercise-ball
    stability ball: exercise-ball
    resistance band: band
    barbell: barbell
    dumbbell: dumbbell
    kettlebell: kettlebell
    cable: cable
    machine: machine
    band: band
