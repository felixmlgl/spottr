name_rules:
  infer:
    smithmachine: smith_machine
    trapbar: trap_bar
    ezbar: ez_bar
    barbell: barbell
    dumbbell: dumbbell
    kettlebell: kettlebell
    cable: cable
    band: band
    medicineball: medicine_ball
    exerciseball: exercise_ball
    machine: machine
    foamroller: foam_roller
    plate: plate
    bosu: bosu
    bodyweight: bodyweight
  replace:
    - {token: smithmachine, from: machine, to: smith_machine}
    - {token: smithmachine, from: barbell, to: smith_machine}
    - {token: trapbar, from: barbell, to: trap_bar}
    - {token: trapbar, from: other, to: trap_bar}
    - {token: ezbar, from: barbell, to: ez_bar}
