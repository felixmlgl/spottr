<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:#1d1d1f;position:relative}
.panel{position:absolute;left:700px;top:0;width:500px;height:630px;background:#f5f5f7}
.wm{position:absolute;left:64px;top:56px;font-size:52px;font-weight:700;letter-spacing:-0.035em;display:flex;align-items:baseline}
.wm i{display:inline-block;width:11px;height:11px;border-radius:50%;background:#34c759;margin-left:2px}
h1{position:absolute;left:64px;top:158px;width:600px;font-size:76px;line-height:1.0;font-weight:700;letter-spacing:-0.04em}
h1 em{font-style:normal;background:linear-gradient(transparent 78%,#34c759 78%,#34c759 92%,transparent 92%)}
p{position:absolute;left:64px;top:452px;font-size:28px;line-height:1.3;font-weight:500;color:#6e6e73;letter-spacing:-0.01em}
.shot{position:absolute;left:728px;top:128px;width:420px;height:320px;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,.35)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:40% 10%;display:block}
.b{position:absolute;width:26px;height:26px;border-color:#fff;border-style:solid;opacity:.92}
.tl{left:14px;top:14px;border-width:3px 0 0 3px}.tr{right:14px;top:14px;border-width:3px 3px 0 0}.bl{left:14px;bottom:14px;border-width:0 0 3px 3px}.br{right:14px;bottom:14px;border-width:0 3px 3px 0}
.chip{position:absolute;left:688px;top:400px;background:#fff;border-radius:20px;padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 34px -10px rgba(0,0,0,.3)}
.chip b{font-size:44px;font-weight:800;letter-spacing:-0.04em;line-height:1}
.chip span{font-size:20px;font-weight:600;line-height:1.15}.chip span small{display:block;font-size:18px;font-weight:500;color:#6e6e73}
.chip i{width:14px;height:14px;border-radius:50%;background:#34c759}
</style></head><body>
<div class="panel"></div>
<div class="wm">Spottr<i></i></div>
<h1>Every set.<br>Every rep.<br><em>Logged.</em></h1>
<p>Automatic workout tracking<br>from existing gym cameras</p>
<div class="shot"><img src="hero-replay-tight-960.webp"><span class="b tl"></span><span class="b tr"></span><span class="b bl"></span><span class="b br"></span></div>
<div class="chip"><b>+1</b><span>rep<small>Squat</small></span><i></i></div>
</body></html>
