# BoT-SORT tuned for a fixed gym camera.
# Static camera -> no global motion compensation (it only reacts to people moving).
# Longer track_buffer so a lifter briefly occluded by someone walking past keeps their ID.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 120 # frames (~2 s at 60 fps)
match_thresh: 0.8
fuse_score: True
gmc_method: none
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto # reuse detector features for ReID, no extra model
